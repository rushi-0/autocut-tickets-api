<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raise a ticket | Autocut Tickets</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="dash">
    <div class="dash-top">
      <div>
        <div class="brand-mark">
          <span class="glyph" aria-hidden="true"></span>
          Autocut
        </div>
        <h1>Raise a ticket</h1>
      </div>
      <button id="btnLogout" class="btn ghost" type="button">Sign out</button>
    </div>

    <div class="dash-grid">
      <div class="panel">
        <div class="panel-head">
          <h2>Describe the issue</h2>
          <span class="eyebrow">AI sorts this</span>
        </div>

        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="Short summary, e.g. Payment failed at checkout" />
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" placeholder="What happened? Include steps, error messages, or anything that helps the team fix it fast."></textarea>
        </div>

        <div class="field">
          <label for="attachment">Attachment (optional)</label>
          <input id="attachment" type="file" accept="image/jpeg,image/png,image/jpg,application/pdf" />
          <div class="hint" style="margin-top:6px">JPEG, PNG or PDF · 5MB max</div>
        </div>

        <div class="field" style="margin-bottom:0">
          <div class="actions">
            <button id="btnCreate" class="btn primary" type="button">Submit ticket</button>
            <span id="loading" class="hint" style="display:none">Submitting…</span>
          </div>
          <div id="msg" class="msg" style="margin-top:12px"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Your tickets</h2>
          <button id="btnLoadMyTickets" class="btn ghost" type="button" style="padding:8px 12px; font-size:12.5px;">Refresh</button>
        </div>
        <div id="list" class="manifest">
          <div class="manifest-empty">No tickets loaded yet — hit refresh.</div>
        </div>
      </div>
    </div>

    <div class="footer-note">Signed-in session · token stored locally for authenticated requests</div>
  </div>

  <script type="module">
    import { api } from './api.js';
    import { clearToken, getToken, setMsg, requireAuth } from './app.js';

    requireAuth('index.html');

    const token = getToken();

    const btnLogout = document.getElementById('btnLogout');
    const btnCreate = document.getElementById('btnCreate');
    const btnLoadMyTickets = document.getElementById('btnLoadMyTickets');

    const loading = document.getElementById('loading');
    const msg = document.getElementById('msg');
    const list = document.getElementById('list');

    btnLogout.addEventListener('click', () => {
      clearToken();
      window.location.href = 'index.html';
    });

    btnCreate.addEventListener('click', async () => {
      setMsg(msg, { type: 'success', text: '' });

      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const attachmentEl = document.getElementById('attachment');
      const attachmentFile = attachmentEl.files && attachmentEl.files.length ? attachmentEl.files[0] : null;

      if(!title || !description){
        setMsg(msg, { type: 'error', text: 'Title and description are required.' });
        return;
      }

      btnCreate.disabled = true;
      loading.style.display = 'inline';

      try{
        const data = await api.createTicket({
          token,
          title,
          description,
          attachmentFile
        });

        const created = data?.ticket?.ticketId ? `Ticket ${data.ticket.ticketId} created.` : 'Ticket created.';
        setMsg(msg, { type: 'success', text: created });

        // reset form
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        document.getElementById('attachment').value = '';

      }catch(err){
        setMsg(msg, { type: 'error', text: err.message || 'Ticket creation failed.' });
      }finally{
        btnCreate.disabled = false;
        loading.style.display = 'none';
      }
    });

    function escapeHtml(str){
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    btnLoadMyTickets.addEventListener('click', async () => {
      list.innerHTML = '<div class="manifest-empty">Loading…</div>';
      try{
        const data = await api.getTickets({ token, page: 1, limit: 10 });
        const tickets = data?.tickets || [];
        if(!tickets.length){
          list.innerHTML = '<div class="manifest-empty">No tickets found. Submit one on the left.</div>';
          return;
        }
        list.innerHTML = tickets.map(t => `
          <div class="manifest-row">
            <div class="m-id">${escapeHtml(t.ticketId)}</div>
            <div class="m-body">
              <div class="m-title">${escapeHtml(t.title)}</div>
              <div class="m-meta">${escapeHtml(t.category || 'Unclassified')}</div>
            </div>
            <span class="status-chip">${escapeHtml(t.status || 'open')}</span>
          </div>
        `).join('');
      }catch(err){
        list.innerHTML = `<div class="manifest-empty">${escapeHtml(err.message || 'Failed to load tickets.')}</div>`;
      }
    });
  </script>
</body>
</html>
